<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171e"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#2e3544" stroke-width="8" fill="none"/>

  <!-- Top Server Blade -->
  <g transform="translate(80, 105)">
    <rect width="352" height="82" rx="18" fill="#1b202a" stroke="#323b4e" stroke-width="4"/>
    <circle cx="46" cy="41" r="11" fill="#10b981" filter="url(#glow)"/>
    <circle cx="82" cy="41" r="11" fill="#38bdf8"/>
    <circle cx="118" cy="41" r="11" fill="#f97316"/>
    <line x1="160" y1="41" x2="280" y2="41" stroke="#323b4e" stroke-width="8" stroke-linecap="round"/>
    <rect x="290" y="29" width="42" height="24" rx="6" fill="#10b981" fill-opacity="0.3"/>
  </g>

  <!-- Middle Server Blade -->
  <g transform="translate(80, 215)">
    <rect width="352" height="82" rx="18" fill="#1b202a" stroke="#323b4e" stroke-width="4"/>
    <circle cx="46" cy="41" r="11" fill="#10b981" filter="url(#glow)"/>
    <circle cx="82" cy="41" r="11" fill="#38bdf8"/>
    <circle cx="118" cy="41" r="11" fill="#71717a"/>
    <line x1="160" y1="41" x2="260" y2="41" stroke="#323b4e" stroke-width="8" stroke-linecap="round"/>
    <rect x="290" y="29" width="42" height="24" rx="6" fill="#38bdf8" fill-opacity="0.3"/>
  </g>

  <!-- Bottom Server Blade -->
  <g transform="translate(80, 325)">
    <rect width="352" height="82" rx="18" fill="#1b202a" stroke="#323b4e" stroke-width="4"/>
    <circle cx="46" cy="41" r="11" fill="#10b981" filter="url(#glow)"/>
    <circle cx="82" cy="41" r="11" fill="#71717a"/>
    <circle cx="118" cy="41" r="11" fill="#71717a"/>
    <line x1="160" y1="41" x2="270" y2="41" stroke="#323b4e" stroke-width="8" stroke-linecap="round"/>
    <rect x="290" y="29" width="42" height="24" rx="6" fill="#10b981" fill-opacity="0.3"/>
  </g>
</svg>
