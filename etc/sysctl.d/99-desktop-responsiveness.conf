# Otimizações de Responsividade para Downloads e Jogos Pesados
# Evita travamento e congelamento do sistema durante downloads rápidos

# 1. Escrita contínua em disco (Elimina o congelamento por acúmulo de I/O)
# Inicia a gravação em disco a cada 64MB em vez de acumular gigabytes na RAM
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# 2. Otimização para ZRAM (Evita stutters e crashes do Chrome)
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# 3. Otimização de Rede e Redução de Bufferbloat (Google BBR)
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr

# 4. Aumento do limite de arquivos abertos e watches (essencial para jogos e Chrome)
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
